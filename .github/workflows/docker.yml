# Builds the container image of ASVAtlas (deploy/Dockerfile) and publishes it
# on the GitHub Container Registry as ghcr.io/alexology/asvatlas:
#   push to main  -> tags "main", "latest" and "sha-<commit>"
#   tag v1.2.3    -> tags "1.2.3" and "1.2"
#   pull request  -> built only, not published
# The image holds the code only: the reference data are mounted at run time.

name: Container image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/alexology/asvatlas

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      # The Dockerfile expects ASVAtlas.jl and its unregistered dependencies
      # (`[sources]` in Project.toml) side by side, as on the development
      # machine; the three dependencies are public repositories.
      - uses: actions/checkout@v4
        with:
          path: ASVAtlas.jl
      - uses: actions/checkout@v4
        with:
          repository: alexology/NucleotideSearch.jl
          path: NucleotideSearch.jl
      - uses: actions/checkout@v4
        with:
          repository: alexology/HaplotypeNetworks.jl
          path: HaplotypeNetworks.jl
      - uses: actions/checkout@v4
        with:
          repository: alexology/ProfileAlignments.jl
          path: ProfileAlignments.jl

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ASVAtlas.jl/deploy/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
