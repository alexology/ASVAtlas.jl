# nginx site for ASVAtlas (e.g. /etc/nginx/conf.d/asvatlas.conf), in front of
# the application listening on 127.0.0.1:8080. Replace the server name, then
# add HTTPS with:  certbot --nginx -d asvatlas.example.org

# At most 30 searches per minute per client address (bursts of 10).
limit_req_zone $binary_remote_addr zone=asvatlas_search:10m rate=30r/m;

server {
    listen 80;
    server_name asvatlas.example.org;

    # Same as the `max_body` of the application (16 MiB).
    client_max_body_size 16m;
    server_tokens off;
    # After enabling HTTPS:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # Uncomment to restrict access to known users
    # (htpasswd -c /etc/nginx/asvatlas.htpasswd <name>):
    # auth_basic "ASVAtlas";
    # auth_basic_user_file /etc/nginx/asvatlas.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/search {
        limit_req zone=asvatlas_search burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080/api/search;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Large searches can take minutes.
        proxy_read_timeout 600s;
    }

    # To publish under a sub-path of an existing site instead
    # (https://example.org/asvatlas/), use, in that site's server block:
    #   location = /asvatlas { return 301 /asvatlas/; }
    #   location /asvatlas/ {
    #       proxy_pass http://127.0.0.1:8080/;
    #       proxy_read_timeout 600s;
    #   }
}
